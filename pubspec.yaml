name: ai_krishi_saathi
description: "AI Krishi Saathi - An AI-Powered Smart Farming Assistant for Indian Farmers"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Premium UI & Styling (Anti-AI Stack)
  flutter_lucide: ^1.2.0
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  fl_chart: ^0.68.0

  # State Management & Persistence
  provider: ^6.1.2
  shared_preferences: ^2.3.2

  # Networking, API & AI
  http: ^1.2.2
  image_picker: ^1.1.2

  # Backend & Cloud Database
  supabase_flutter: ^2.8.0

  # Utilities
  intl: ^0.20.2
  geolocator: ^14.1.1
  geocoding: ^5.0.0
  speech_to_text: ^7.5.0
  flutter_tts: ^4.2.5
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/vectors/
    - assets/data/
